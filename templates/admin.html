<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Horizonte - Panel de administración</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Academia Horizonte</h1>
        <p>Panel de administración - Dar acceso a usuarios</p>
    </header>

    <main>
        <!-- El Salón: solo muestra el formulario y la lista; guardar lo hace la Cocina -->
        <section class="ficha">
            <h2>Crear acceso</h2>
            {% if mensaje %}
            <p class="mensaje">{{ mensaje }}</p>
            {% endif %}
            <form method="post" action="/admin">
                <label for="correo">Correo del usuario</label>
                <input type="email" id="correo" name="correo" required>

                <label for="clave">Contraseña asignada</label>
                <input type="password" id="clave" name="clave" required>

                <button type="submit">Dar acceso</button>
            </form>
        </section>

        <section class="tabla">
            <table>
                <thead>
                    <tr><th>Correo con acceso</th></tr>
                </thead>
                <tbody>
                    {% for correo in usuarios %}
                    <tr><td>{{ correo }}</td></tr>
                    {% else %}
                    <tr><td>Aún no hay usuarios creados.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Academia Horizonte - <a href="/logout">Cerrar sesión</a></p>
    </footer>
</body>
</html>
