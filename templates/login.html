<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Horizonte - Entrar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">
    <!-- El Salón: solo muestra el formulario; la validación la hace la Cocina (app.py) -->
    <main class="login">
        <section class="tarjeta-login">
            <h1>Academia Horizonte</h1>
            <p>Emisión de certificados por cohorte</p>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <form method="post" action="/login">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required autofocus>

                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" required>

                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>
</body>
</html>
